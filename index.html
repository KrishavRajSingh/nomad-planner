<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nomad Plan</title>
<style>
  :root{
    --bg:#0f1216; --panel:#161b21; --line:#252c35; --text:#e6e9ee; --muted:#8b97a6;
    --accent:#f0b429; --good:#3fbf7f; --bad:#ef5b5b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{padding:28px 20px 8px;max-width:1080px;margin:0 auto}
  h1{margin:0;font-size:22px;letter-spacing:-.02em}
  h1 span{color:var(--accent)}
  .sub{color:var(--muted);font-size:13px;margin-top:4px}
  main{max-width:1080px;margin:0 auto;padding:0 20px 60px}
  section{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin-top:18px}
  h2{font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 12px}
  table{width:100%;border-collapse:collapse}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
    text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);font-weight:600}
  td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
  tr:last-child td{border-bottom:none}
  input,select,textarea{
    width:100%;background:#0d1116;color:var(--text);border:1px solid var(--line);
    border-radius:7px;padding:7px 9px;font:inherit;font-size:14px;min-width:0}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
  input[type=number]{text-align:right}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  .row-actions{display:flex;gap:6px;justify-content:flex-end}
  button{background:#0d1116;color:var(--text);border:1px solid var(--line);border-radius:8px;
    padding:7px 12px;font:inherit;font-size:13px;cursor:pointer}
  button:hover{border-color:var(--accent);color:var(--accent)}
  button.primary{background:var(--accent);color:#161b21;border-color:var(--accent);font-weight:600}
  button.primary:hover{filter:brightness(1.08);color:#161b21}
  button.danger:hover{border-color:var(--bad);color:var(--bad)}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .totals{display:flex;gap:26px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
  .stat{min-width:140px}
  .stat .k{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .stat .v{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
  .stat .v.good{color:var(--good)} .stat .v.bad{color:var(--bad)}
  .hint{color:var(--muted);font-size:12px;margin-top:10px}
  a{color:var(--accent)}
  .pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;border:1px solid var(--line);color:var(--muted)}
  textarea{resize:vertical;min-height:38px}
  @media(max-width:760px){
    table.mini thead{display:none}
    table.mini tr{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;padding:10px 0;
      border-bottom:1px solid var(--line)}
    table.mini td{border:none;padding:2px 0}
    table.mini td.wide{grid-column:1/-1}
    table.mini td .lbl{display:block;font-size:10px;text-transform:uppercase;color:var(--muted);letter-spacing:.05em}
    td .lbl{display:none}
  }
  td .lbl{display:none}
</style>
</head>
<body>
<header>
  <h1>Nomad <span>Plan</span></h1>
  <div class="sub">Dharamshala April 2027. Edit anything. Saved in this browser only.</div>
</header>

<main>
  <section id="verdict">
    <h2>Readiness</h2>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px">
      <label>Target monthly sales (USD)
        <input id="target" type="number" min="0" step="10" value="500">
      </label>
      <label>Saved runway (USD)
        <input id="saved" type="number" min="0" step="100" value="2000">
      </label>
      <label>Move month
        <input id="movemonth" type="text" value="April 2027">
      </label>
    </div>
    <div class="totals" id="readinessTotals"></div>
  </section>

  <section>
    <h2>Places</h2>
    <table class="mini">
      <thead>
        <tr>
          <th style="width:24%">Place</th><th>Region</th><th style="width:90px">USD/mo</th>
          <th style="width:110px">Status</th><th>Notes</th><th style="width:150px">Link</th><th style="width:44px"></th>
        </tr>
      </thead>
      <tbody id="places"></tbody>
    </table>
    <div class="toolbar"><button id="addPlace">+ Add place</button></div>
  </section>

  <section>
    <h2>Monthly expenditure</h2>
    <table class="mini">
      <thead>
        <tr><th style="width:30%">Item</th><th style="width:110px">USD</th><th>Note</th><th style="width:44px"></th></tr>
      </thead>
      <tbody id="expenses"></tbody>
    </table>
    <div class="toolbar">
      <button id="addExpense">+ Add item</button>
      <button id="addPreset">Load Dharamshala preset</button>
    </div>
    <div class="totals" id="expenseTotals"></div>
    <div class="hint" id="verdictLine"></div>
  </section>

  <section>
    <h2>Data</h2>
    <div class="toolbar">
      <button id="export" class="primary">Export JSON</button>
      <button id="importBtn">Import JSON</button>
      <input id="importFile" type="file" accept="application/json" hidden>
      <button id="reset" class="danger">Reset</button>
    </div>
    <div class="hint">Export before clearing your browser data. Nothing is sent anywhere.</div>
  </section>
</main>

<script>
const KEY = "nomad-plan-v1";
const INRRATE = 88;

const seedPlaces = [
  {name:"RCA Homestay Room 4", region:"Dharamshala, HP", cost:163, status:"Booked",
   notes:"Kitchen, private attached bath, 4 gyms nearby. April pick.",
   link:"https://www.airbnb.co.in/rooms/1724664273651377765"},
  {name:"Shiva Home Stay", region:"Dharamshala, HP", cost:196, status:"Backup",
   notes:"Kitchen, shared bath, 4.94 / 34 reviews.",
   link:"https://www.airbnb.co.in/rooms/557526178479243799"},
  {name:"Galaxy Residency", region:"McLeod Ganj, HP", cost:196, status:"Backup",
   notes:"Dedicated bath, heating listed, 4.95 / 22 reviews.",
   link:"https://www.airbnb.co.in/rooms/54048816"},
  {name:"Solo bedroom + kitchen", region:"Gangtok, Sikkim", cost:191, status:"Shortlist",
   notes:"4.97 / 39 reviews. Best rated. Longer travel from Patna.",
   link:"https://www.airbnb.co.in/rooms/573741624667803985"},
  {name:"Studio with kitchen", region:"Arambol, Goa", cost:138, status:"Rejected",
   notes:"Cheapest, but no AC. April is 32C+ humid.",
   link:"https://www.airbnb.co.in/rooms/1688638873105738560"},
  {name:"Coastal stay", region:"Varkala, Kerala", cost:230, status:"Later",
   notes:"Hot and humid in April. Nov-Feb town.",
   link:""},
  {name:"Desert stay", region:"Jaisalmer, Rajasthan", cost:219, status:"Later",
   notes:"40C+ in April. Wrong month.",
   link:""}
];

const seedExpenses = [
  {name:"Room", usd:163, note:"RCA Homestay, 29 nights"},
  {name:"Food, cooked veg + eggs", usd:79, note:"Oats, 5 eggs/day, soya, paneer, chapati"},
  {name:"Chicken outside", usd:11, note:"4 meals a month"},
  {name:"Transport", usd:11, note:"Autos and buses"},
  {name:"Gym", usd:23, note:"Monthly pass"},
  {name:"Phone", usd:5, note:"Data plan"},
  {name:"Buffer", usd:30, note:"Laundry, medical, random"},
  {name:"Tools", usd:60, note:"Productivity, AI"}
];

let state = load();

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){ const p = JSON.parse(raw); if(p && p.places && p.expenses) return p; }
  }catch(e){}
  return {
    target:500, saved:2000, movemonth:"April 2027",
    places: seedPlaces.map(p=>({...p})),
    expenses: seedExpenses.map(e=>({...e}))
  };
}
function save(){
  localStorage.setItem(KEY, JSON.stringify(state));
}
const usd = n => "$" + (Number(n)||0).toLocaleString("en-US",{maximumFractionDigits:0});
const inr = n => "\u20b9" + Math.round((Number(n)||0)*INRRATE).toLocaleString("en-IN");

function el(tag, props={}, ...kids){
  const n = document.createElement(tag);
  for(const [k,v] of Object.entries(props)){
    if(k === "class") n.className = v;
    else if(k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for(const kid of kids) if(kid != null) n.append(kid);
  return n;
}
function field(label, value, onInput, type="text"){
  const input = el("input",{type, value: value ?? "", "aria-label":label});
  input.addEventListener("input", e => onInput(e.target.value));
  return input;
}

function renderPlaces(){
  const body = document.getElementById("places");
  body.replaceChildren();
  state.places.forEach((p, i) => {
    const tr = el("tr");
    tr.append(
      el("td",{class:"wide"}, el("span",{class:"lbl"}, "Place"),
        field("Place name", p.name, v => { p.name = v; save(); })),
      el("td",{}, el("span",{class:"lbl"}, "Region"),
        field("Region", p.region, v => { p.region = v; save(); })),
      el("td",{}, el("span",{class:"lbl"}, "USD per month"),
        field("Cost USD", p.cost, v => { p.cost = Number(v)||0; save(); }, "number")),
      el("td",{}, el("span",{class:"lbl"}, "Status"), statusSelect(p, i)),
      el("td",{class:"wide"}, el("span",{class:"lbl"}, "Notes"),
        field("Notes", p.notes, v => { p.notes = v; save(); })),
      el("td",{class:"wide"}, el("span",{class:"lbl"}, "Link"),
        field("Link", p.link, v => { p.link = v; save(); })),
      el("td",{}, el("div",{class:"row-actions"},
        el("button",{class:"danger", title:"Delete", onclick:() => {
          state.places.splice(i,1); save(); renderPlaces();
        }}, "\u00d7")))
    );
    body.append(tr);
  });
}

function statusSelect(p, i){
  const sel = el("select",{"aria-label":"Status"});
  ["Booked","Backup","Shortlist","Later","Rejected"].forEach(s => {
    const o = el("option",{value:s}, s);
    if(p.status === s) o.selected = true;
    sel.append(o);
  });
  sel.addEventListener("change", e => { p.status = e.target.value; save(); });
  return sel;
}

function renderExpenses(){
  const body = document.getElementById("expenses");
  body.replaceChildren();
  state.expenses.forEach((x, i) => {
    const tr = el("tr");
    tr.append(
      el("td",{class:"wide"}, el("span",{class:"lbl"}, "Item"),
        field("Item", x.name, v => { x.name = v; save(); })),
      el("td",{}, el("span",{class:"lbl"}, "USD"),
        field("USD", x.usd, v => { x.usd = Number(v)||0; save(); }, "number")),
      el("td",{}, el("span",{class:"lbl"}, "Note"),
        field("Note", x.note, v => { x.note = v; save(); })),
      el("td",{}, el("div",{class:"row-actions"},
        el("button",{class:"danger", title:"Delete", onclick:() => {
          state.expenses.splice(i,1); save(); renderExpenses();
        }}, "\u00d7")))
    );
    body.append(tr);
  });
}

function renderTotals(){
  const spend = state.expenses.reduce((s,x) => s + (Number(x.usd)||0), 0);
  const target = Number(state.target)||0;
  const saved = Number(state.saved)||0;
  const buffer = target - spend;
  const months = spend > 0 ? (saved / spend) : 0;

  document.getElementById("expenseTotals").replaceChildren(
    stat("Monthly spend", usd(spend) + " / " + inr(spend)),
    stat("Buffer at target", usd(buffer), buffer >= 0 ? "good" : "bad"),
    stat("Runway from savings", months.toFixed(1) + " months", months >= 3 ? "good" : "bad")
  );

  document.getElementById("readinessTotals").replaceChildren(
    stat("Target", usd(target) + " / month"),
    stat("Spend", usd(spend) + " / month"),
    stat("Gap", usd(target - spend), target - spend >= 0 ? "good" : "bad")
  );

  const line = document.getElementById("verdictLine");
  if(spend === 0){ line.textContent = "Add expenses to see the verdict."; return; }
  if(buffer >= 100){
    line.textContent = `On paper this works: ${usd(target)} covers ${usd(spend)} with ${usd(buffer)} spare. Hold that for 3 months before booking.`;
  } else if(buffer >= 0){
    line.textContent = `Too thin. ${usd(buffer)} spare is one bad week from the emergency fund. Aim for ${usd(Math.ceil((spend+100)/50)*50)}.`;
  } else {
    line.textContent = `Losing ${usd(Math.abs(buffer))} a month at this target. You need ${usd(Math.ceil(spend/50)*50)} before moving.`;
  }
}

function stat(k, v, cls){
  return el("div",{class:"stat"},
    el("div",{class:"k"}, k),
    el("div",{class:"v" + (cls ? " "+cls : "")}, v));
}

// wiring
document.getElementById("target").addEventListener("input", e => {
  state.target = Number(e.target.value)||0; save(); renderTotals();
});
document.getElementById("saved").addEventListener("input", e => {
  state.saved = Number(e.target.value)||0; save(); renderTotals();
});
document.getElementById("movemonth").addEventListener("input", e => {
  state.movemonth = e.target.value; save();
});
document.getElementById("addPlace").addEventListener("click", () => {
  state.places.push({name:"", region:"", cost:0, status:"Shortlist", notes:"", link:""});
  save(); renderPlaces();
});
document.getElementById("addExpense").addEventListener("click", () => {
  state.expenses.push({name:"", usd:0, note:""});
  save(); renderExpenses(); renderTotals();
});
document.getElementById("addPreset").addEventListener("click", () => {
  state.expenses = seedExpenses.map(e=>({...e}));
  save(); renderExpenses(); renderTotals();
});
document.getElementById("export").addEventListener("click", () => {
  const blob = new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const a = el("a",{href:URL.createObjectURL(blob), download:"nomad-plan.json"});
  document.body.append(a); a.click(); a.remove();
  URL.revokeObjectURL(a.href);
});
document.getElementById("importBtn").addEventListener("click", () => {
  document.getElementById("importFile").click();
});
document.getElementById("importFile").addEventListener("change", async e => {
  const f = e.target.files[0]; if(!f) return;
  try{
    const p = JSON.parse(await f.text());
    if(!p.places || !p.expenses) throw new Error("missing places or expenses");
    state = p; save(); hydrate(); renderAll();
  }catch(err){ alert("Could not import: " + err.message); }
  e.target.value = "";
});
document.getElementById("reset").addEventListener("click", () => {
  if(!confirm("Reset to the Dharamshala plan? Your edits are lost.")) return;
  localStorage.removeItem(KEY);
  state = load(); hydrate(); renderAll();
});

function hydrate(){
  document.getElementById("target").value = state.target;
  document.getElementById("saved").value = state.saved;
  document.getElementById("movemonth").value = state.movemonth;
}
function renderAll(){ renderPlaces(); renderExpenses(); renderTotals(); }

hydrate();
renderAll();
</script>
</body>
</html>
